name: Build Jellyfin Web File Manager

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Publish
        run: dotnet publish -c Release --no-build -o publish

      - name: Package
        run: |
          chmod +x package.sh
          ./package.sh

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-web-file-manager
          path: dist/*.zip
